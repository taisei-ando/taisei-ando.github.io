{{- if .IsHome }}
{{- $isJapanese := eq .Language.Lang "ja" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "mainEntity": {
    "@type": "Person",
    "@id": "https://taisei-ando.github.io/#person",
    "name": {{ cond $isJapanese "安藤 大生" "Taisei Ando" | jsonify | safeJS }},
    "alternateName": {{ cond $isJapanese (slice "安藤大生" "Taisei Ando") (slice "安藤 大生" "安藤大生") | jsonify | safeJS }},
    "url": {{ .Permalink | jsonify | safeJS }},
    "jobTitle": {{ cond $isJapanese "博士課程学生" "Ph.D. Student" | jsonify | safeJS }},
    "affiliation": {
      "@type": "Organization",
      "name": {{ cond $isJapanese "東京大学" "The University of Tokyo" | jsonify | safeJS }}
    },
    "sameAs": [
      "https://github.com/imonalc",
      "https://scholar.google.com/citations?user=F40bkuIAAAAJ"
    ]
  }
}
</script>
{{- end }}
